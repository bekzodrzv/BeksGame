<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beks Game</title>
  <link rel="stylesheet" href="game.css">
</head>


<body>

  <h1>
    <img src="fastlogo.png" alt="Logo" class="brand-logo">
  <span class="brand-main">Beks Game</span>
  <span class="brand-sub">
    Top <span class="brand-f">F</span>ast Education
  </span>
</h1>

<!-- Account Settings Modal -->
<div class="modal" id="accountModal">
  <div class="modal-box">
    <h2>Profil sozlamalari</h2>
    <label for="displayNameInput"></label>
    <input type="text" id="displayNameInput" placeholder="Ismingiz">
    <br><br>
    <button class="bigBtn" id="saveProfileBtn">Saqlash</button>
    <button class="bigBtn" onclick="closeAccountModal()">Yopish</button>
  </div>
</div>

<!-- Account Settings button (Logout yonida) -->
<button class="bigBtn" id="accountBtn">Profil</button>

  <!-- Logout -->
  <button class="bigBtn" id="logoutBtn">Chiqish</button>

  <!-- Categories -->
  <div class="categories">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
  </div>

  <!-- Game board -->
  <div class="board" id="board"></div>
  <div id="bonusEffect" class="bonusEffect hidden">🔥 2X BONUS 🔥</div>
  <audio id="bonusSound" src="bonus.mp3" preload="auto"></audio>


  <!-- Question Modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="qText"></h2>
      <button class="bigBtn" onclick="showAnswer()">Javobni ko‘rsat</button>
      <p id="aText" class="hidden"></p>
      <div id="timer">10</div>
      <audio id="tickSound" src="tick.mp3" preload="auto"></audio>
      <button class="bigBtn" onclick="closeModal()">Yopish</button>
    </div>
  </div>

<audio id="clickSound" src="click.mp3.wav"></audio>
<audio id="winnerSound" src="cheer.mp3.wav"></audio>


  <!-- Teams -->
  <div class="teamAdd">

  <!-- CHAP -->
  <div class="leftControls">
    <div class="settingsBox">
      <label>Ball:</label>
      <input type="number" id="pointStepInput" value="100" min="1">

      <label>Rejim:</label>
      <select id="pointModeSelect">
        <option value="fixed">Bir xil</option>
        <option value="progressive">100-200-300</option>
      </select>

      <button onclick="updatePointSettings()">Saqlash</button>
    </div>
  </div>

  <!-- O'RTA team qo`shish tugmasi eskisi--> 
  <div class="centerControls">
    <!--<input type="text" id="teamNameInput" placeholder="Team nomi">
    <button class="bigBtn" onclick="addTeam()">Team qo‘shish</button>-->

    <button class="bigBtn" onclick="addParticipant()">
  🧑 Ishtirokchi qo‘shish
</button>
  </div>

  <!-- O'NG -->
  <div class="rightControls">
    <button class="shBtn" onclick="shuffleQuestionsByButton()">
      🔀 Savollarni aralashtirish
    </button>
  </div>

</div>
  <div class="teams" id="teams"></div>
<!-- 🧑‍🤝‍🧑 ISHTIROKCHILAR LISTI -->
 <div class="participantsHeader">
  <button id="toggleParticipantsBtn" class="bigBtn">
    👥 Barchasini ko‘rsatish
  </button>
</div>

<div id="participantsBox" class="participantsBox"></div>

  
  <!-- TOPIC PANEL (MUSTAQIL) -->
<div id="userTopicPanel"></div>



<h2>Boshqa foydalanuvchilar mavzulari</h2>

<div class="otherTopicSearch">
  <input type="text" id="otherTopicSearchInput" placeholder="Mavzu nomi bo‘yicha qidirish...">
</div>

<div id="otherTopicPanel"></div>
  
  <!-- GAME HISTORY -->
<div id="gameHistory" class="historyBox">
  <h2>📜 O‘yinlar tarixi</h2>
  <div id="historyList"></div>
</div>

<button class="bigBtn" id="downloadTemplateBtn">📄 Shablon yuklash</button>
<input type="text" id="newUserTopicTitle" placeholder="Yangi topic nomi">
<button class="bigBtn" onclick="addUserTopic()">Qo‘shish</button>

<input type="file" id="userTopicExcelInput">
<button class="bigBtn" onclick="importExcelForUserTopic()">Excel’dan yuklash</button>


<div class="timeredit">
<label class="secund"for="timerInput">Savol vaqti (sekund):</label>
<input type="number" id="timerInput" min="1" max="300" value="10">
<button class="bigBtn" onclick="updateTimer()">O‘zgartirish</button>
</div>


  <!-- Winner Modal -->
  <div id="winnerModal">
    <div id="winnerText"></div>
    <div id="restWinners"></div>
    <canvas id="confetti"></canvas>
  </div>

  <!-- History -->
  <div id="history"></div>

  <!-- XLSX doim game.js DAN OLDIN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script type="module" src="game.js"></script>

  <!-- game.js MODULE -->

</body>


</html>
