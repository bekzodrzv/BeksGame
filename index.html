<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beks Game - Kirish</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="authWrap">

    <div class="authLogo">
      <div class="authLogoMark"><img src="logo.svg" alt="Beks Game"></div>
      <div class="authLogoText">Beks Game</div>
      <div class="authLogoSub">Top <span class="brand-f">F</span>ast Education</div>
    </div>

    <!-- LOGIN FORM (default ochiq) -->
    <div id="loginForm" style="display:block;">
      <h2>Kirish</h2>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <label for="loginPassword">Parol</label>
      <input type="password" id="loginPassword" placeholder="Parol" required>
      <button onclick="loginUser()">Kirish</button>
      <button class="guestBtn" onclick="loginOffline()">🌐 Offline (Mehmon)</button>
      <p class="formToggle">Yoki <span id="showRegister">Ro‘yxatdan o‘tish</span></p>
    </div>

    <!-- REGISTER FORM (default yopiq) -->
    <div id="registerForm" style="display:none;">
      <h2>Ro‘yxatdan o‘tish</h2>
      <label for="registerName">Ism</label>
      <input type="text" id="registerName" placeholder="Ism" required>
      <label for="registerEmail">Email</label>
      <input type="email" id="registerEmail" placeholder="Email" required>
      <label for="registerPassword">Parol</label>
      <input type="password" id="registerPassword" placeholder="Parol" required>
      <label for="registerPasswordConfirm">Parolni tasdiqlash</label>
      <input type="password" id="registerPasswordConfirm" placeholder="Parolni tasdiqlash" required>
      <button onclick="registerUser()">Ro‘yxatdan o‘tish</button>
      <p class="formToggle">Yoki <span id="showLogin">Kirish</span></p>
    </div>

  </div>

  <script type="module">
  import { auth } from "./firebase.js";
  import { 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    updateProfile,
    setPersistence,
    browserLocalPersistence,
    onAuthStateChanged,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // =========================
  // 🔥 1) OFFLINE UCHUN PERSISTENCE
  // =========================
  try {
    await setPersistence(auth, browserLocalPersistence);
    console.log("✅ Auth persistence yoqildi (offline qo‘llab-quvvatlash)");
  } catch (e) {
    console.warn("⚠️ Persistence yoqilmadi:", e);
  }

  // =========================
  // 🔄 FORM TOGGLE
  // =========================
  document.getElementById("showRegister").onclick = () => {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
  };

  document.getElementById("showLogin").onclick = () => {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
  };

  // =========================
  // ✅ LOGIN
  // =========================
  window.loginUser = async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      return alert("Email va parol kiriting!");
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);

      // UID ni localStorage ga saqlaymiz (game.js ga kerak)
      localStorage.setItem("uid", auth.currentUser.uid);

      window.location.href = "game.html";
    } catch (e) {
      console.error(e);

      if (e.code === "auth/network-request-failed") {
        alert("❌ Internet yo‘q!\nAgar oldin shu qurilmada kirgan bo‘lsangiz, qayta urinib ko‘ring.");
      } else {
        alert("Xato: " + e.message);
      }
    }
  };

  // =========================
  // ✅ REGISTER
  // =========================
  window.registerUser = async () => {
    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;
    const passwordConfirm = document.getElementById("registerPasswordConfirm").value;

    if (!name || !email || !password || !passwordConfirm) {
      return alert("Barcha maydonlar to‘ldirilishi kerak!");
    }

    if (password !== passwordConfirm) {
      return alert("Parol va tasdiqlash mos emas!");
    }

    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);

      // Ismni profilga yozamiz
      await updateProfile(userCred.user, { displayName: name });

      // UID ni localStorage ga saqlaymiz
      localStorage.setItem("uid", userCred.user.uid);

      window.location.href = "game.html";
    } catch (e) {
      console.error(e);
      alert("Xato: " + e.message);
    }
  };

  // =========================
  // 🔹 OFFLINE (GUEST) MODE
  // =========================
  window.loginOffline = async () => {
    try {
      await signInAnonymously(auth);
      window.location.href = "game.html";
    } catch (e) {
      console.error(e);

      if (
        e.code === "auth/admin-restricted-operation" ||
        e.code === "auth/operation-not-allowed"
      ) {
        alert(
          "Mehmon rejimi hozircha yoqilmagan (Firebase konsolida " +
          "\"Anonymous\" kirish usuli o‘chiq). Administrator buni " +
          "Firebase Console → Authentication → Sign-in method → " +
          "Anonymous bo‘limidan yoqishi kerak."
        );
      } else if (e.code === "auth/network-request-failed") {
        alert("❌ Internet yo‘q! Qayta urinib ko‘ring.");
      } else {
        alert("Xato: " + e.message);
      }
    }
  };

  // =========================
  // 🔍 AGAR ALLAQACHON KIRGAN BO‘LSA — AVTOMAT KIRISH
  // =========================
  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("Oldindan kirilgan user:", user.uid);
      localStorage.setItem("uid", user.uid);
      // ixtiyoriy: avtomatik o‘tkazish
      // window.location.href = "game.html";
    }
  });
</script>

</body>
</html>
